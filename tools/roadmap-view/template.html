<title>watch-audio ロードマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: summary strip → "next up" queue → dependency flow → status board (columns stack on phones) */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2130; --muted: #5f6879; --line: #dde1e8; --accent: #2f5fb3;
  --done: #2f7d4f; --done-bg: #e3f2e8;
  --doing: #2f5fb3; --doing-bg: #e2ebfb;
  --ready: #9a6c00; --ready-bg: #fff3cf;
  --waiting: #6b7385; --waiting-bg: #eceef3;
  --device: #b4461f; --device-bg: #fbe4da;
  --later: #8a8f99; --later-bg: #f0f1f3;
  --p0: #b42318; --p1: #9a6c00; --p2: #8a8f99;
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1f28; --ink: #e6e9ef; --muted: #9aa3b4; --line: #2b3240; --accent: #8fb0f0;
    --done: #7fd19f; --done-bg: #183324; --doing: #8fb0f0; --doing-bg: #1b2a47;
    --ready: #f0c560; --ready-bg: #3a2f10; --waiting: #a3abbb; --waiting-bg: #232936;
    --device: #f0987a; --device-bg: #3d2117; --later: #8a909c; --later-bg: #20242c;
    --p0: #ff8f85; --p1: #f0c560; --p2: #8a909c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1f28; --ink: #e6e9ef; --muted: #9aa3b4; --line: #2b3240; --accent: #8fb0f0;
  --done: #7fd19f; --done-bg: #183324; --doing: #8fb0f0; --doing-bg: #1b2a47;
  --ready: #f0c560; --ready-bg: #3a2f10; --waiting: #a3abbb; --waiting-bg: #232936;
  --device: #f0987a; --device-bg: #3d2117; --later: #8a909c; --later-bg: #20242c;
  --p0: #ff8f85; --p1: #f0c560; --p2: #8a909c;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 28px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 4px 0 0; }
.goal { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
@media (max-width: 720px) { .goal { grid-template-columns: 1fr; } }
.meter { display: grid; gap: 6px; min-width: 260px; }
.meter-label { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); }
.meter-label b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: .85rem; background: var(--surface); border: 1px solid var(--line); }
.count b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.next { display: grid; gap: 8px; }
.next-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--bg); text-decoration: none; color: inherit; }
.next-row:hover, .next-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.next-row .rank { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.next-row .why { color: var(--muted); font-size: .82rem; }
.flow { overflow-x: auto; }
.flow pre.mermaid { margin: 0; background: transparent; min-width: 720px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: .82rem; margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters .label { color: var(--muted); font-size: .82rem; margin-right: 2px; }
.chip-btn { font: inherit; font-size: .82rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: start; }
.col { display: grid; gap: 8px; min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 6px 2px; border-bottom: 2px solid var(--line); }
.col-head .n { margin-left: auto; font-family: var(--font-mono); color: var(--muted); font-weight: 400; }
.card { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; border-left: 4px solid var(--stripe, var(--line)); }
.card:hover, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.card .top { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.num { font-family: var(--font-mono); color: var(--muted); font-size: .82rem; }
.code { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.title { font-weight: 500; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .72rem; padding: 1px 7px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.prio { font-family: var(--font-mono); font-size: .72rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.prio.P0 { color: var(--p0); } .prio.P1 { color: var(--p1); } .prio.P2 { color: var(--p2); }
.deps { font-size: .78rem; color: var(--muted); }
.deps .open { color: var(--device); }
.empty { color: var(--muted); font-size: .85rem; padding: 6px 2px; }
.foot { color: var(--muted); font-size: .8rem; }
@media (prefers-reduced-motion: no-preference) { .card, .next-row { transition: transform .12s ease; } .card:hover, .next-row:hover { transform: translateY(-1px); } }
</style>

<div class="wrap">
  <header class="goal">
    <div>
      <h1>watch-audio ロードマップ</h1>
      <p class="sub">現在のゴール: Watch を装着している間ずっと録音し、スマホで文字起こしして、データが端末内にたまっていく（v0.1 コア）</p>
    </div>
    <div class="meter" aria-label="v0.1 コアの進捗">
      <div class="meter-label"><span>v0.1 コア（P0）の完了</span><b id="core-count"></b></div>
      <div class="bar" id="core-bar"></div>
    </div>
  </header>

  <div class="counts" id="counts"></div>

  <section class="panel" aria-labelledby="next-h">
    <h2 id="next-h">次にやること</h2>
    <div class="next" id="next"></div>
  </section>

  <section class="panel" aria-labelledby="flow-h">
    <h2 id="flow-h">依存関係（P0・P1）</h2>
    <div class="flow"><pre class="mermaid">__MERMAID__</pre></div>
    <div class="legend" id="legend"></div>
  </section>

  <section aria-labelledby="board-h" style="display:grid;gap:12px">
    <h2 id="board-h" style="margin:0">ボード</h2>
    <div class="filters" id="filters"></div>
    <div class="board" id="board"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
const DATA = /*__DATA__*/null;
const STATUS = {
  doing:   { label: "実装中",        color: "var(--doing)",   bg: "var(--doing-bg)" },
  ready:   { label: "着手可能",      color: "var(--ready)",   bg: "var(--ready-bg)" },
  waiting: { label: "依存待ち",      color: "var(--waiting)", bg: "var(--waiting-bg)" },
  device:  { label: "実機待ち",      color: "var(--device)",  bg: "var(--device-bg)" },
  done:    { label: "完了",          color: "var(--done)",    bg: "var(--done-bg)" },
  later:   { label: "後回し（P2）",  color: "var(--later)",   bg: "var(--later-bg)" },
};
const ORDER = ["doing", "ready", "waiting", "device", "done", "later"];
const TAG_LABEL = { watchOS: "watchOS", wearOS: "Wear OS", asr: "文字起こし", sync: "転送", ui: "UI", search: "検索", ai: "AI", setup: "基盤", release: "リリース", spike: "検証" };
const items = DATA.items.filter(x => x.stateReason !== "not_planned");
const byNum = Object.fromEntries(DATA.items.map(x => [x.n, x]));

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") e.setAttribute("style", v); else if (k in e) e[k] = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}

// Summary
const core = items.filter(x => x.prio === "P0");
document.getElementById("core-count").textContent = `${DATA.coreDone} / ${DATA.coreTotal}`;
const bar = document.getElementById("core-bar");
for (const s of ["done", "doing", "device", "ready", "waiting"]) {
  const n = core.filter(x => x.status === s).length;
  if (n) bar.append(el("span", { title: `${STATUS[s].label}: ${n}`, style: `width:${n / core.length * 100}%;background:${STATUS[s].color}` }));
}
const counts = document.getElementById("counts");
for (const s of ORDER) {
  const n = items.filter(x => x.status === s).length;
  counts.append(el("span", { className: "count" }, el("span", { className: "dot", style: `background:${STATUS[s].color}` }), STATUS[s].label, el("b", {}, String(n))));
}

// Next up: P0 in progress first, then P0 ready, then P1 ready.
const next = [
  ...items.filter(x => x.prio === "P0" && x.status === "doing"),
  ...items.filter(x => x.prio === "P0" && x.status === "ready"),
  ...items.filter(x => x.prio === "P1" && x.status === "ready"),
].slice(0, 8);
const nextEl = document.getElementById("next");
next.forEach((x, i) => {
  const unlocks = x.blocks.filter(n => byNum[n] && byNum[n].state === "open").map(n => "#" + n);
  const why = x.status === "doing" ? "実装中" : "着手可能（依存はすべて完了）";
  nextEl.append(el("a", { className: "next-row", href: x.url, target: "_blank", rel: "noopener" },
    el("span", { className: "rank" }, String(i + 1).padStart(2, "0")),
    el("span", {}, el("span", { className: "num" }, `#${x.n} `), el("span", { className: "title" }, x.title),
      el("div", { className: "why" }, why + (unlocks.length ? ` ・ 完了すると ${unlocks.join(" ")} が進められる` : ""))),
    el("span", { className: `prio ${x.prio}` }, x.prio)));
});
if (!next.length) nextEl.append(el("p", { className: "empty" }, "着手可能な Issue はありません（依存待ち・実機待ちのみ）。"));

// Legend for the flow chart
const legend = document.getElementById("legend");
for (const s of ORDER) legend.append(el("span", {}, el("span", { className: "dot", style: `background:${STATUS[s].color}` }), " ", STATUS[s].label));

// Board with filters
const state = { prio: new Set(["P0", "P1"]), tag: null };
try { const saved = JSON.parse(localStorage.getItem("roadmap-filters") || "null"); if (saved) { state.prio = new Set(saved.prio); state.tag = saved.tag; } } catch (e) {}
const filters = document.getElementById("filters");
function renderFilters() {
  filters.replaceChildren(el("span", { className: "label" }, "優先度"));
  for (const p of ["P0", "P1", "P2"]) {
    filters.append(el("button", { className: "chip-btn", type: "button", "aria-pressed": String(state.prio.has(p)), onclick: () => { state.prio.has(p) ? state.prio.delete(p) : state.prio.add(p); update(); } }, p));
  }
  filters.append(el("span", { className: "label", style: "margin-left:10px" }, "領域"));
  for (const t of [null, ...Object.keys(TAG_LABEL).filter(t => items.some(x => x.tags.includes(t)))]) {
    filters.append(el("button", { className: "chip-btn", type: "button", "aria-pressed": String(state.tag === t), onclick: () => { state.tag = t; update(); } }, t ? TAG_LABEL[t] : "すべて"));
  }
}
function card(x) {
  const deps = x.blockedBy.length
    ? el("div", { className: "deps" }, "依存: ", ...x.blockedBy.map((n, i) => el("span", { className: byNum[n] && byNum[n].state === "open" ? "open" : "" }, (i ? ", " : "") + "#" + n)))
    : null;
  return el("a", { className: "card", href: x.url, target: "_blank", rel: "noopener", style: `--stripe:${STATUS[x.status].color}` },
    el("div", { className: "top" }, el("span", { className: "num" }, "#" + x.n), x.code ? el("span", { className: "code" }, x.code) : null),
    el("div", { className: "title" }, x.title),
    el("div", { className: "meta" }, el("span", { className: `prio ${x.prio}` }, x.prio), ...x.tags.map(t => el("span", { className: "tag" }, TAG_LABEL[t] || t))),
    deps);
}
function update() {
  try { localStorage.setItem("roadmap-filters", JSON.stringify({ prio: [...state.prio], tag: state.tag })); } catch (e) {}
  renderFilters();
  const visible = items.filter(x => state.prio.has(x.prio) && (!state.tag || x.tags.includes(state.tag)));
  const board = document.getElementById("board");
  board.replaceChildren();
  for (const s of ORDER) {
    const list = visible.filter(x => x.status === s);
    if (s === "later" && !state.prio.has("P2")) continue;
    board.append(el("div", { className: "col" },
      el("div", { className: "col-head" }, el("span", { className: "dot", style: `background:${STATUS[s].color}` }), STATUS[s].label, el("span", { className: "n" }, String(list.length))),
      list.length ? list.map(card) : el("p", { className: "empty" }, "なし")));
  }
}
update();
document.getElementById("foot").textContent = `GitHub Issues（${DATA.repo}）から生成: ${DATA.generatedAt}。カードをクリックすると GitHub の Issue が開きます。`;
</script>
