name: WatchAudio
options:
  bundleIdPrefix: app.watchaudio
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp, Shared]
    settings:
      base:
        PRODUCT_NAME: WatchAudio
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, ComposeApp]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin framework is only built for iosSimulatorArm64.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: Apple Watch で会話を録音し、iPhone 上で文字起こしするために使用します。
        NSSpeechRecognitionUsageDescription: 録音した会話を iPhone 上（オンデバイス）で文字起こしするために使用します。音声が端末の外に送られることはありません。
        # Transcription of received chunks while charging (BGProcessingTask, see IosAppGraph.kt).
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [app.watchaudio.transcribe]
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED}" = "YES" ]; then exit 0; fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: WatchApp
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  WatchApp:
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    settings:
      base:
        PRODUCT_NAME: WatchAudio
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX)
        NSMicrophoneUsageDescription: 会話を録音し、iPhone 上で文字起こしするために使用します。
        # Keeps the recorder running with the screen off (verified in M0-3).
        UIBackgroundModes: [audio]
        # Complication tap (#41): watchaudio://record opens the app and starts / resumes recording.
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).record
            CFBundleURLSchemes: [watchaudio]
        # App Group read by RecorderStatusStore (shared with the complication).
        WatchAudioAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: WatchApp/WatchApp.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: WatchWidget
        embed: true

  # Watch face complication / Smart Stack widget showing the recording state (#41).
  # Shares RecorderStatus via the App Group; tapping opens the watch app (widgetURL).
  WatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidget
      - path: WatchApp/Complication/RecorderStatus.swift
      - path: WatchApp/Complication/ComplicationViews.swift
      - path: Shared/ChunkProtocol.swift
    settings:
      base:
        PRODUCT_NAME: WatchAudioWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp.widget
        SKIP_INSTALL: YES
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WatchAudioAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: WatchWidget/WatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # Logic tests (no host app, no Kotlin framework) for the Swift wire-protocol code shared by
  # the watch and the phone, against the Kotlin test vectors in shared/core-protocol/testdata.
  ProtocolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Shared
      - ProtocolTests
      - path: ../shared/core-protocol/testdata
        buildPhase: resources
      # Complication state mapping and layouts (#41, ComplicationDisplayTests).
      - path: WatchApp/Complication/RecorderStatus.swift
      - path: WatchApp/Complication/ComplicationViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).protocoltests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # The watch app is built and embedded through iosApp's target dependency; listing it
  # here as well would restrict the scheme to watchOS destinations.
  iosApp:
    build:
      targets:
        iosApp: all
  WatchApp:
    build:
      targets:
        WatchApp: all
  ProtocolTests:
    build:
      targets:
        ProtocolTests: [test]
    test:
      targets: [ProtocolTests]
