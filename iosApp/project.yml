name: WatchAudio
options:
  bundleIdPrefix: app.watchaudio
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp, Shared]
    settings:
      base:
        PRODUCT_NAME: WatchAudio
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, ComposeApp]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin framework is only built for iosSimulatorArm64.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: Apple Watch で会話を録音し、iPhone 上で文字起こしするために使用します。
        NSSpeechRecognitionUsageDescription: 録音した会話を iPhone 上（オンデバイス）で文字起こしするために使用します。音声が端末の外に送られることはありません。
        # Transcription of received chunks while charging (BGProcessingTask, see IosAppGraph.kt).
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [app.watchaudio.transcribe]
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED}" = "YES" ]; then exit 0; fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: WatchApp
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  WatchApp:
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    settings:
      base:
        PRODUCT_NAME: WatchAudio
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX)
        NSMicrophoneUsageDescription: 会話を録音し、iPhone 上で文字起こしするために使用します。
        # Keeps the recorder running with the screen off (verified in M0-3).
        UIBackgroundModes: [audio]

  # Logic tests (no host app, no Kotlin framework) for the Swift wire-protocol code shared by
  # the watch and the phone, against the Kotlin test vectors in shared/core-protocol/testdata.
  ProtocolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Shared
      - ProtocolTests
      - path: ../shared/core-protocol/testdata
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).protocoltests
        GENERATE_INFOPLIST_FILE: YES

  # Logic tests (no host app) for the watch recorder's pure parts: stop reasons / state
  # (RecorderPolicy, #15) and the send queue (ChunkOutbox + ChunkSendTracker, #17). These files
  # use Foundation/AVFoundation only, so they are compiled for the iPhone simulator here.
  WatchLogicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Shared
      - WatchLogicTests
      - path: WatchApp/Recording/RecorderPolicy.swift
      - path: WatchApp/Recording/ChunkSendTracker.swift
      - path: WatchApp/Recording/ChunkOutbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchlogictests
        GENERATE_INFOPLIST_FILE: YES

  # SpeechAnalyzer / SpeechTranscriber (ja_JP) on the simulator (#21). Hosted by the iOS app so
  # the Speech framework sees the app's bundle and usage descriptions; the test bundle compiles
  # its own copy of SpeechTranscription.swift and does not touch the Kotlin framework.
  SpeechTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpeechTests
      - TestSupport
      - path: iosApp/SpeechTranscription.swift
    dependencies:
      - target: iosApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).speechtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchAudio.app/WatchAudio
        BUNDLE_LOADER: $(TEST_HOST)
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # Real playback through the app's own IosAppServices (AVAudioPlayer) in the app process (#19):
  # the Kotlin/Native test executable cannot start AVAudioPlayer. Hosted by the iOS app, whose
  # IosAppGraph is started at launch. The Kotlin framework is static and linked into the app only:
  # this bundle sees its headers, resolves its symbols through BUNDLE_LOADER and must not autolink
  # a second copy of the Kotlin runtime.
  PlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlaybackTests
      - TestSupport
    dependencies:
      - target: iosApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).playbacktests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchAudio.app/WatchAudio
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_SWIFT_FLAGS: [$(inherited), -Xfrontend, -disable-autolink-framework, -Xfrontend, ComposeApp]
        CLANG_MODULES_AUTOLINK: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  # The watch app is built and embedded through iosApp's target dependency; listing it
  # here as well would restrict the scheme to watchOS destinations.
  iosApp:
    build:
      targets:
        iosApp: all
  WatchApp:
    build:
      targets:
        WatchApp: all
  # Hostless Swift logic tests (CI: "Swift unit tests (iOS Simulator)").
  SwiftUnitTests:
    build:
      targets:
        ProtocolTests: [test]
        WatchLogicTests: [test]
    test:
      targets: [ProtocolTests, WatchLogicTests]
  SpeechTests:
    build:
      targets:
        SpeechTests: [test]
    test:
      targets: [SpeechTests]
  PlaybackTests:
    build:
      targets:
        PlaybackTests: [test]
    test:
      targets: [PlaybackTests]
