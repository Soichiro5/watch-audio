org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# Compile in the Gradle daemon: keeps memory bounded when several builds run in parallel.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.native.ignoreDisabledTargets=true

# App version (#138): the only place to change it (docs/dev/04-dev-environment.md §7.2).
# Phone and Wear OS read it through build-logic (versionName / versionCode). XcodeGen cannot read
# this file, so apps/ios/project.yml repeats it (MARKETING_VERSION / CURRENT_PROJECT_VERSION) and
# tools/check-version fails CI when they differ.
watchaudio.versionName=0.1.0
watchaudio.versionCode=1
