name: WatchAudio
options:
  bundleIdPrefix: app.watchaudio
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

# Swift packages: each one is a privacy decision (tools/privacy-check policy.IOS_SWIFT_PACKAGES) and
# pinned to an exact version.
packages:
  # ONNX Runtime (MIT, Microsoft) for the embedding model of semantic search on the iPhone (#178):
  # the official package with the Objective-C API over the prebuilt runtime (CPU only, no network).
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2

settings:
  base:
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Must equal watchaudio.versionName / watchaudio.versionCode in gradle.properties, the single
    # source of the app version (#138); tools/check-version fails CI otherwise.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - App
      - SharedSwift
      # Privacy manifests (#159): one per bundle, copied to the bundle root. Kept outside the
      # source folders so each target lists exactly its own; the declared reasons are justified in
      # docs/legal/store-data-declarations.md §2.3.
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: WatchAudio
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, ComposeApp]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin framework is only built for iosSimulatorArm64.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSSpeechRecognitionUsageDescription: 録音した会話を iPhone 上（オンデバイス）で文字起こしするために使用します。音声が端末の外に送られることはありません。
        # Agent access (#185): the QR code of the PC's pairing, read on the device; asked only when scanning.
        NSCameraUsageDescription: PC とのペアリング用の QR コードを読み取るために使用します。映像は端末内で QR コードを探すことにだけ使い、保存も送信もしません。
        # Agent access (#185): the connection to the user's own paired PC on the same network, only while it is on.
        NSLocalNetworkUsageDescription: エージェント連携を ON にしている間だけ、同じネットワーク内のペアリングした PC につなぐために使用します。
        NSBonjourServices: [_watchaudio-mcp._tcp]
        # Transcription of received chunks while charging (BGProcessingTask, see IosAppGraph.kt).
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [app.watchaudio.transcribe]
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED}" = "YES" ]; then exit 0; fi
          cd "$SRCROOT/../.."
          ./gradlew :shared:ui:embedAndSignAppleFrameworkForXcode
    dependencies:
      # The embedding model of semantic search (#178), App/Embedding/EmbeddingPlatform.swift.
      - package: OnnxRuntime
        product: onnxruntime
      - target: WatchApp
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  WatchApp:
    type: application
    platform: watchOS
    sources:
      - Watch
      - SharedSwift
      - path: Privacy/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: WatchAudio
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX)
        NSMicrophoneUsageDescription: 会話を録音し、iPhone 上で文字起こしするために使用します。
        # Keeps the recorder running with the screen off (verified in M0-3).
        UIBackgroundModes: [audio]
        # Complication tap (#41): watchaudio://record opens the app and starts / resumes recording.
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).record
            CFBundleURLSchemes: [watchaudio]
        # App Group read by RecorderStatusStore (shared with the complication).
        WatchAudioAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Watch/WatchApp.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: WatchWidget
        embed: true

  # Watch face complication / Smart Stack widget showing the recording state (#41).
  # Shares RecorderStatus via the App Group; tapping opens the watch app (widgetURL).
  WatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidget
      - path: Watch/Complication/RecorderStatus.swift
      - path: Watch/Complication/ComplicationViews.swift
      - path: SharedSwift/ChunkProtocol.swift
      - path: Privacy/WatchWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: WatchAudioWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp.widget
        SKIP_INSTALL: YES
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: watch-audio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WatchAudioAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: WatchWidget/WatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # Logic tests (no host app, no Kotlin framework) for the Swift wire-protocol code shared by
  # the watch and the phone, against the Kotlin test vectors in shared/protocol/testdata.
  ProtocolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SharedSwift
      - Tests/ProtocolTests
      - path: ../../shared/protocol/testdata
        buildPhase: resources
      # Complication state mapping and layouts (#41, ComplicationDisplayTests).
      - path: Watch/Complication/RecorderStatus.swift
      - path: Watch/Complication/ComplicationViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).protocoltests
        GENERATE_INFOPLIST_FILE: YES

  # Logic tests (no host app) for the watch recorder's pure parts: stop reasons / state
  # (RecorderPolicy, #15) and the send queue (ChunkOutbox + ChunkSendTracker, #17). These files
  # use Foundation/AVFoundation only, so they are compiled for the iPhone simulator here.
  WatchLogicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SharedSwift
      - Tests/WatchLogicTests
      - path: Watch/Recording/RecorderPolicy.swift
      - path: Watch/Recording/ChunkSendTracker.swift
      - path: Watch/Recording/ChunkOutbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchlogictests
        GENERATE_INFOPLIST_FILE: YES

  # SpeechAnalyzer / SpeechTranscriber (ja_JP) on the simulator (#21), and English next to
  # Japanese through the shared routing and pipeline (#170). Hosted by the iOS app so the Speech
  # framework sees the app's bundle and usage descriptions; the test bundle compiles its own copies
  # of SpeechTranscription.swift and SpeechAnalyzerTranscriber.swift. The English check reaches the
  # Kotlin framework (IosTranscriptionCheck) like PlaybackTests: headers only, symbols through
  # BUNDLE_LOADER, no second copy of the Kotlin runtime.
  SpeechTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SpeechTests
      - Tests/TestSupport
      - path: App/SpeechTranscription.swift
      - path: App/SpeechAnalyzerTranscriber.swift
    dependencies:
      - target: iosApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).speechtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchAudio.app/WatchAudio
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_SWIFT_FLAGS: [$(inherited), -Xfrontend, -disable-autolink-framework, -Xfrontend, ComposeApp]
        CLANG_MODULES_AUTOLINK: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # Real playback through the app's own IosAppServices (AVAudioPlayer) in the app process (#19):
  # the Kotlin/Native test executable cannot start AVAudioPlayer. Hosted by the iOS app, whose
  # IosAppGraph is started at launch. The Kotlin framework is static and linked into the app only:
  # this bundle sees its headers, resolves its symbols through BUNDLE_LOADER and must not autolink
  # a second copy of the Kotlin runtime.
  PlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PlaybackTests
      - Tests/TestSupport
    dependencies:
      - target: iosApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).playbacktests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchAudio.app/WatchAudio
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_SWIFT_FLAGS: [$(inherited), -Xfrontend, -disable-autolink-framework, -Xfrontend, ComposeApp]
        CLANG_MODULES_AUTOLINK: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # Agent access end to end (#185) in the app process: the app's own IosAgentAccess (Keychain,
  # Network.framework) pairs with the real bridge CLI on the CI host (127.0.0.1, the simulator shares
  # the host's network) and answers its agent's tool calls while on, then stops when turned off, when
  # the app leaves the screen and when the pairing is revoked. Driven by
  # .github/scripts/ios-agent-access.sh; linked like PlaybackTests.
  AgentAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AgentAccessTests
      - Tests/TestSupport
    dependencies:
      - target: iosApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).agentaccesstests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchAudio.app/WatchAudio
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_SWIFT_FLAGS: [$(inherited), -Xfrontend, -disable-autolink-framework, -Xfrontend, ComposeApp]
        CLANG_MODULES_AUTOLINK: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # Semantic search (#178) in the app process: the app's own EmbeddingPlatform (ONNX Runtime from
  # the Swift package, the URLSession download) through IosEmbeddingCheck, against the JVM's
  # reference vectors, a paraphrase search and a resumed download. The model comes from
  # build/embedding-model (.github/scripts/ios-embedding-model.sh). Linked like PlaybackTests.
  EmbeddingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EmbeddingTests
      - Tests/TestSupport
    dependencies:
      - target: iosApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).embeddingtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatchAudio.app/WatchAudio
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_SWIFT_FLAGS: [$(inherited), -Xfrontend, -disable-autolink-framework, -Xfrontend, ComposeApp]
        CLANG_MODULES_AUTOLINK: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  # The watch app is built and embedded through iosApp's target dependency; listing it
  # here as well would restrict the scheme to watchOS destinations.
  iosApp:
    build:
      targets:
        iosApp: all
  WatchApp:
    build:
      targets:
        WatchApp: all
  # Hostless Swift logic tests (CI: "Swift unit tests (iOS Simulator)").
  SwiftUnitTests:
    build:
      targets:
        ProtocolTests: [test]
        WatchLogicTests: [test]
    test:
      targets: [ProtocolTests, WatchLogicTests]
  SpeechTests:
    build:
      targets:
        SpeechTests: [test]
    test:
      targets: [SpeechTests]
  PlaybackTests:
    build:
      targets:
        PlaybackTests: [test]
    test:
      targets: [PlaybackTests]
  AgentAccessTests:
    build:
      targets:
        AgentAccessTests: [test]
    test:
      targets: [AgentAccessTests]
  EmbeddingTests:
    build:
      targets:
        EmbeddingTests: [test]
    test:
      targets: [EmbeddingTests]
