name: Deliver (main)

# CD: every merge into main produces installable builds, kept as artifacts.
# Store distribution (TestFlight / Play internal testing) is added once signing
# credentials are configured as repository secrets.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "tools/roadmap-view/**"
      - "research/**"
      - "spikes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build phone and Wear OS apps
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - name: Collect builds
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk "dist/watch-audio-phone-${GITHUB_SHA::7}.apk"
          cp wearApp/build/outputs/apk/debug/*.apk "dist/watch-audio-wear-${GITHUB_SHA::7}.apk"
          {
            echo "### Builds for ${GITHUB_SHA::7}"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo
            echo "Install: \`adb install -r <file>\` (phone and watch need the same build)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watch-audio-android-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
