name: Deliver (main)

# CD: every merge into main produces installable builds, kept as artifacts.
# Store distribution (TestFlight / Play internal testing) is added once signing
# credentials are configured as repository secrets.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "tools/roadmap-view/**"
      - "research/**"
      - "spikes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build phone and Wear OS apps
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - name: Collect builds
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*.apk "dist/watch-audio-phone-${GITHUB_SHA::7}.apk"
          cp wearApp/build/outputs/apk/debug/*.apk "dist/watch-audio-wear-${GITHUB_SHA::7}.apk"
          {
            echo "### Builds for ${GITHUB_SHA::7}"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo
            echo "Install: \`adb install -r <file>\` (phone and watch need the same build)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-audio-android-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
