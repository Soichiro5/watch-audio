name: Deliver (main)

# CD: every merge into main produces installable builds, kept as artifacts.
# Store distribution (TestFlight / Play internal testing) is added once signing
# credentials are configured as repository secrets.
# A manual run on another branch is a dry run: the same build and checks, no artifact (#173).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "tools/roadmap-view/**"
      - "tools/check-links/**"
      - ".github/workflows/links.yml"
      - "research/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    # +~7 min when the sherpa-onnx JNI cache misses (a new sherpa-onnx version, #173).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # #173: the delivered phone APK packs sherpa-onnx's JNI library built without text-to-speech
      # (the AAR's statically links eSpeak NG, GPL-3.0). Cached; docs/dev/04 §7.3.
      - name: sherpa-onnx JNI without TTS
        uses: ./.github/actions/sherpa-onnx-jni

      # assembleDebug also runs verifyDebugSherpaOnnxJni (the packed library is the one built without TTS).
      - name: Build phone and Wear OS apps
        run: ./gradlew :apps:android:assembleDebug :apps:wear:assembleDebug

      - name: Collect builds
        run: |
          mkdir -p dist
          cp apps/android/build/outputs/apk/debug/*.apk "dist/watch-audio-phone-${GITHUB_SHA::7}.apk"
          cp apps/wear/build/outputs/apk/debug/*.apk "dist/watch-audio-wear-${GITHUB_SHA::7}.apk"
          {
            echo "### Builds for ${GITHUB_SHA::7}"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo
            echo "Install: \`adb install -r <file>\` (phone and watch need the same build)."
          } >> "$GITHUB_STEP_SUMMARY"

      # #173: nothing is delivered if the phone APK contains eSpeak NG / TTS / diarization code.
      - name: sherpa-onnx JNI without TTS (delivered phone APK)
        run: |
          tools/sherpa-onnx-android/check-no-tts.sh dist/watch-audio-phone-*.apk
          cat apps/android/build/reports/sherpa-onnx-jni/debug.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: watch-audio-android-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
