name: Android & shared

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared: JVM + Android host)
        run: ./gradlew jvmTest testAndroidHostTest

      - name: Lint
        run: ./gradlew :androidApp:lintDebug :wearApp:lintDebug

      - name: Assemble phone + Wear OS
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            wearApp/build/outputs/apk/debug/*.apk
          retention-days: 7
