name: Android & shared

# Runs on every PR into main and on main itself (the official branch).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "tools/roadmap-view/**"
      - "tools/check-links/**"
      - ".github/workflows/links.yml"
      - "research/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "tools/roadmap-view/**"
      - "tools/check-links/**"
      - ".github/workflows/links.yml"
      - "research/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # +~7 min when the sherpa-onnx JNI cache misses (a new sherpa-onnx version, #173).
    timeout-minutes: 45
    # Every check runs through tools/check/check.sh (#202): the same steps run on a developer's
    # machine (`tools/check/check.sh fast` / `harness`, docs/dev/04 「手元での確認」). This file only
    # sets up the runner and uploads the artifacts; tools/check/test_parity.py keeps it that way.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #138: the app version lives in gradle.properties only; apps/ios/project.yml must repeat the
      # same values (XcodeGen cannot read gradle.properties). Seconds, no build. This workflow runs
      # on every change outside docs, so also when only gradle.properties or project.yml changes.
      - name: "Version check (gradle.properties = apps/ios/project.yml)"
        run: tools/check/check.sh step version

      # #76: data stays on the device (CLAUDE.md "Local only"). Static part first: seconds, no build.
      # Permissions, backup rules, network APIs / URLs in code, declared dependencies, iOS
      # Info.plist keys and entitlements against tools/privacy-check/policy.py (docs/dev/04 §6.4).
      - name: "Local-only check (static)"
        run: tools/check/check.sh step privacy-static

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # #173: every APK of this job (debug-apks, release-apks) packs sherpa-onnx's JNI library built
      # without text-to-speech (the AAR's statically links eSpeak NG, GPL-3.0). Cached; docs/dev/04 §7.3.
      - name: sherpa-onnx JNI without TTS
        uses: ./.github/actions/sherpa-onnx-jni

      - name: "Unit tests (shared: JVM + Android host; ONNX Runtime binding; phone and Wear OS app JVM tests)"
        run: tools/check/check.sh step unit-tests

      # #23, #72: a year of generated Japanese utterances as the pipeline cuts them since #68
      # (~3.2 million segments, ~650 MB since #94); fails if any query's p95 exceeds 300 ms. The numbers land
      # in the job summary either way.
      - name: "Search benchmark (3.2M segments, target 300 ms)"
        run: tools/check/check.sh step search-benchmark

      - name: Cache ASR models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/harness/models
          key: asr-models-${{ hashFiles('tools/harness/download-models.sh') }}

      - name: Install ffmpeg (end-to-end test audio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: "End-to-end without devices (chunks -> ingest -> on-device ASR -> SQLite)"
        run: tools/check/check.sh step harness

      - name: Lint
        run: tools/check/check.sh step lint

      - name: Assemble phone + Wear OS
        run: tools/check/check.sh step assemble-debug

      # #76: the same policy on what ships: release merged manifests (permissions added by
      # libraries) and the resolved release runtime classpath (transitive dependencies).
      - name: "Local-only check (merged manifests, resolved dependencies)"
        run: tools/check/check.sh step privacy-merged

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks
          path: |
            apps/android/build/outputs/apk/debug/*.apk
            apps/wear/build/outputs/apk/debug/*.apk
          retention-days: 7

      # #78: release builds with R8 of both apps. assembleRelease also runs the Wear OS guard
      # verifyReleaseDebugInput (#57: the debug audio file input must not be in a release build).
      # Signed only when the release key secrets exist (docs/dev/04 §7.1); fork PRs and a repository
      # without the secrets build unsigned APKs, which are not uploaded. The step writes the key to the
      # runner's temp dir only (output signed=true), the next step removes it; secret values are never echoed.
      - name: Assemble release (R8) + debug input leak check
        id: release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          WATCHAUDIO_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          WATCHAUDIO_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          WATCHAUDIO_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: tools/check/check.sh step assemble-release

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # #173: besides verify<Variant>SherpaOnnxJni of assemble (the packed library is the one built
      # without TTS, linked against the packed libonnxruntime.so), an independent check of the APKs.
      # Fails on eSpeak NG / TTS / diarization markers in any ABI.
      - name: sherpa-onnx JNI without TTS (release and debug APKs)
        run: tools/check/check.sh step check-no-tts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.signed == 'true'
        with:
          name: release-apks
          path: |
            apps/android/build/outputs/apk/release/*-release.apk
            apps/wear/build/outputs/apk/release/*-release.apk
          retention-days: 7

      # Screens rendered by shared/ui's AppUiTest (onboarding incl. the refused permission #32, tabs).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: shared/ui/build/screenshots/
          if-no-files-found: ignore
          retention-days: 30
