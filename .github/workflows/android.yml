name: Android & shared

# Runs on every PR into main and on main itself (the official branch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: "Unit tests (shared: JVM + Android host; phone and Wear OS app JVM tests)"
        run: ./gradlew jvmTest testAndroidHostTest :androidApp:testDebugUnitTest :wearApp:testDebugUnitTest

      # #23, #72: a year of generated Japanese utterances as the pipeline cuts them since #68
      # (~3.2 million segments, ~1 GB); fails if any query's p95 exceeds 300 ms. The numbers land
      # in the job summary either way.
      - name: "Search benchmark (3.2M segments, target 300 ms)"
        run: |
          status=0
          ./gradlew :shared:core-db:jvmBenchmark -Pbenchmark.segments=3200000 || status=$?
          cat shared/core-db/build/reports/search-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Cache ASR models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tools/harness/models
          key: asr-models-${{ hashFiles('tools/harness/download-models.sh') }}

      - name: "End-to-end without devices (chunks -> ingest -> on-device ASR -> SQLite)"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          tools/harness/download-models.sh
          ./gradlew :tools:harness:test -PrequireModels=true

      - name: Lint
        run: ./gradlew :androidApp:lintDebug :wearApp:lintDebug

      - name: Assemble phone + Wear OS
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apks
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            wearApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      # Screens rendered by composeApp's AppUiTest (onboarding incl. the refused permission #32, tabs).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-screenshots
          path: composeApp/build/screenshots/
          if-no-files-found: ignore
          retention-days: 30
