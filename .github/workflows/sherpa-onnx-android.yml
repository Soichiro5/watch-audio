name: sherpa-onnx JNI (Android, no TTS)

# #173: builds sherpa-onnx's libsherpa-onnx-jni.so for the Android app without text-to-speech
# (eSpeak NG, GPL-3.0, is statically linked into the JitPack AAR's library) and speaker diarization,
# from the upstream commit, NDK and ABIs pinned in gradle/sherpa-onnx-jni.properties, with the upstream
# build scripts (tools/sherpa-onnx-android/build-jni.sh). Each build is checked for eSpeak NG / TTS
# markers and for linking against the AAR's libonnxruntime.so, and compared with the pinned SHA-256.
# Run manually with `publish` to create the GitHub Release `release` the app build downloads from
# (refused when that release exists: published files never change). docs/dev/04-dev-environment.md §7.3.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sherpa-onnx-android.yml"
      - "tools/sherpa-onnx-android/**"
      - "gradle/sherpa-onnx-jni.properties"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sherpa-onnx-android.yml"
      - "tools/sherpa-onnx-android/**"
      - "gradle/sherpa-onnx-jni.properties"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release named in gradle/sherpa-onnx-jni.properties (release=) with the built libraries"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Must equal `abis` in gradle/sherpa-onnx-jni.properties (checked below).
        abi: [arm64-v8a, x86_64]
    name: build (${{ matrix.abi }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pins
        id: pins
        run: |
          prop() { grep -E "^$1=" gradle/sherpa-onnx-jni.properties | head -n 1 | cut -d= -f2-; }
          case ",$(prop abis)," in *",${{ matrix.abi }},"*) ;; *) echo "${{ matrix.abi }} is not in abis=$(prop abis)"; exit 1 ;; esac
          [ "$(prop abis)" = "arm64-v8a,x86_64" ] || { echo "abis=$(prop abis): update this workflow's matrix"; exit 1; }
          for key in version commit ndk; do echo "$key=$(prop $key)" >> "$GITHUB_OUTPUT"; done
          echo "jni-sha256=$(prop jni.sha256.${{ matrix.abi }})" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: k2-fsa/sherpa-onnx
          ref: ${{ steps.pins.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Check the upstream commit is the tag
        run: |
          tag_commit=$(git ls-remote https://github.com/k2-fsa/sherpa-onnx "refs/tags/${{ steps.pins.outputs.version }}^{}" "refs/tags/${{ steps.pins.outputs.version }}" | tail -n 1 | cut -f1)
          echo "tag ${{ steps.pins.outputs.version }} -> $tag_commit"
          [ "$tag_commit" = "${{ steps.pins.outputs.commit }}" ]

      - name: Install the NDK ${{ steps.pins.outputs.ndk }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ steps.pins.outputs.ndk }}" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ steps.pins.outputs.ndk }}" >> "$GITHUB_ENV"

      - name: Build libsherpa-onnx-jni.so (TTS and diarization off)
        run: tools/sherpa-onnx-android/build-jni.sh ${{ matrix.abi }} upstream out

      # Evidence that only TTS / diarization code depends on the switched-off options: the files
      # that test them (the ASR, VAD and their JNI code must not be among them).
      - name: Sources that depend on the switched-off options
        run: |
          {
            echo "### ${{ matrix.abi }}: sources testing SHERPA_ONNX_ENABLE_TTS / SPEAKER_DIARIZATION"
            echo '```'
            grep -rlE 'SHERPA_ONNX_ENABLE_(TTS|SPEAKER_DIARIZATION)' upstream/sherpa-onnx --include='*.cc' --include='*.h' | sed 's|^upstream/||' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with the pinned SHA-256
        run: |
          actual=$(sha256sum out/libsherpa-onnx-jni-${{ matrix.abi }}.so | cut -d' ' -f1)
          pinned=${{ steps.pins.outputs.jni-sha256 }}
          if [ "$actual" = "$pinned" ]; then result="same as the pinned file (reproduced)"; else result="differs from the pinned $pinned"; fi
          {
            echo "### ${{ matrix.abi }}"
            echo
            echo "- sherpa-onnx ${{ steps.pins.outputs.version }} (${{ steps.pins.outputs.commit }}), NDK ${{ steps.pins.outputs.ndk }}"
            echo "- libsherpa-onnx-jni-${{ matrix.abi }}.so: $(wc -c < out/libsherpa-onnx-jni-${{ matrix.abi }}.so) bytes, sha256 \`$actual\`: $result"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cp upstream/LICENSE out/sherpa-onnx-LICENSE.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sherpa-onnx-jni-${{ matrix.abi }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Creates the release (and its tag) with the built libraries.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prop() { grep -E "^$1=" gradle/sherpa-onnx-jni.properties | head -n 1 | cut -d= -f2-; }
          release=$(prop release)
          case "$release" in "sherpa-onnx-jni-$(prop version)-"*) ;; *) echo "release=$release must start with sherpa-onnx-jni-$(prop version)-"; exit 1 ;; esac
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $release exists; published files never change. Bump the release number in gradle/sherpa-onnx-jni.properties."
            exit 1
          fi
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sherpa-onnx-jni-$abi" --dir "dist/$abi"
            cp "dist/$abi/libsherpa-onnx-jni-$abi.so" dist/
          done
          cp dist/arm64-v8a/sherpa-onnx-LICENSE.txt dist/
          {
            echo "sherpa-onnx $(prop version) ([\`$(prop commit)\`](https://github.com/k2-fsa/sherpa-onnx/commit/$(prop commit))) の Android 用 JNI ライブラリ \`libsherpa-onnx-jni.so\`。"
            echo "音声合成（TTS: eSpeak NG・piper-phonemize）と話者分離（hclust-cpp）を外してビルドした（#173）。"
            echo
            echo "- ビルド: 上流の build-android-*.sh、NDK $(prop ndk)、\`SHERPA_ONNX_ENABLE_TTS=OFF\`・\`SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF\`・\`SHERPA_ONNX_ENABLE_C_API=OFF\`（[ワークフローの実行]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)、コミット $GITHUB_SHA）"
            echo "- \`libonnxruntime.so\` は含めない（アプリは JitPack の AAR に入っているものを使う。リンク先が同じファイルであることをビルドで確認済み）"
            echo "- ライセンス: sherpa-onnx は Apache-2.0（\`sherpa-onnx-LICENSE.txt\`）。中に含まれるもの（kaldi-native-fbank・kaldi-decoder・kaldifst・OpenFst・simple-sentencepiece は Apache-2.0、JSON for Modern C++ は MIT）はアプリのライセンス画面に表示している"
            echo
            echo "| ファイル | SHA-256 |"
            echo "| --- | --- |"
            for f in dist/*.so dist/sherpa-onnx-LICENSE.txt; do echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "sherpa-onnx JNI $(prop version) without TTS ($release)" --notes-file notes.md \
            dist/libsherpa-onnx-jni-*.so dist/sherpa-onnx-LICENSE.txt
