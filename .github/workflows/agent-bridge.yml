name: Agent bridge

# Agent access (#182, #183): the bridge CLI (tools/agent-bridge) and its end-to-end test with the
# JVM fake phone (tools/agent-fake-phone, the shared tool logic in shared/agent).
# The checks run through tools/check/check.sh (#202), as on a developer's machine (`check.sh fast`).
on:
  push:
    branches: [main]
    paths:
      - "tools/agent-bridge/**"
      - "tools/agent-fake-phone/**"
      - "shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/agent-bridge.yml"
      - "tools/check/check.sh"
      - "tools/check/lib.sh"
      - "tools/check/steps-bridge.sh"
  pull_request:
    branches: [main]
    paths:
      - "tools/agent-bridge/**"
      - "tools/agent-fake-phone/**"
      - "shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/agent-bridge.yml"
      - "tools/check/check.sh"
      - "tools/check/lib.sh"
      - "tools/check/steps-bridge.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CLI runs on the user's PC: type-check and unit tests (wire fixtures shared with Kotlin,
  # certificates, pairing, TLS refusals, MCP over stdio) on the three desktop OSes.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on Windows: tools/check/check.sh is a bash script.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent-bridge/package-lock.json
      # No install scripts: every dependency is plain JavaScript.
      - name: npm ci
        run: tools/check/check.sh step bridge-npm-ci
      - name: npm run lint
        run: tools/check/check.sh step bridge-lint
      - name: npm test
        run: tools/check/check.sh step bridge-test

  # pairing → mutual TLS → MCP tool calls from a scripted MCP client over stdio → answers from the
  # fake phone's database, plus the refusals (unpaired peer, wrong key, expired value, revoked
  # pairing) and the check that the bridge opens no outbound connection.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent-bridge/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: "Shared agent logic (JVM tests) and the fake phone"
        run: tools/check/check.sh step bridge-fake-phone

      - name: "Bridge CLI"
        run: tools/check/check.sh step bridge-npm-ci

      - name: "End to end: bridge CLI + fake phone"
        run: tools/check/check.sh step bridge-e2e
