name: iOS & watchOS

# macOS minutes are billed at 10x on private repos, so this only runs when
# Apple-side or shared code changes (or on demand).
on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
      # #185: the agent access check runs the bridge CLI's host driver (e2e/emulator-host.ts).
      - "tools/agent-bridge/**"
      - "tools/check/check.sh"
      - "tools/check/lib.sh"
      - "tools/check/steps-bridge.sh"
      - "tools/check/steps-ios.sh"
      - "!**/*.md"
      - "!docs/**"
      - "!**/src/androidMain/**"
      - "!**/src/androidHostTest/**"
      - "!**/src/androidDeviceTest/**"
      - "!**/src/jvmMain/**"
      - "!**/src/jvmTest/**"
      - "!.github/scripts/phone-scenarios.sh"
      - "!.github/scripts/wear-surfaces.sh"
      - "!.github/scripts/launch-smoke.sh"
      - "!.github/scripts/release-asr.sh"
      - "!.github/scripts/push-models.sh"
      - "!.github/scripts/agent-access.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
      # #185: the agent access check runs the bridge CLI's host driver (e2e/emulator-host.ts).
      - "tools/agent-bridge/**"
      - "tools/check/check.sh"
      - "tools/check/lib.sh"
      - "tools/check/steps-bridge.sh"
      - "tools/check/steps-ios.sh"
      - "!**/*.md"
      - "!docs/**"
      - "!**/src/androidMain/**"
      - "!**/src/androidHostTest/**"
      - "!**/src/androidDeviceTest/**"
      - "!**/src/jvmMain/**"
      - "!**/src/jvmTest/**"
      - "!.github/scripts/phone-scenarios.sh"
      - "!.github/scripts/wear-surfaces.sh"
      - "!.github/scripts/launch-smoke.sh"
      - "!.github/scripts/release-asr.sh"
      - "!.github/scripts/push-models.sh"
      - "!.github/scripts/agent-access.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The steps run through tools/check/check.sh (#202), as `check.sh ios` (all of it) and
  # `check.sh ios-build` (the project and the builds only) do on a developer's Mac
  # (tools/check/steps-ios.sh). This file sets up the runner and uploads the evidence.
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show Xcode version
        run: xcodebuild -version

      # The app-hosted playback check (PlaybackTests, #19) needs AVAudioPlayer's clock to run,
      # i.e. an audio output device on the host; add a virtual one if the runner has none.
      - name: Audio output for the simulators
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType | tee audio-devices.txt
          if ! grep -q "Default Output Device: Yes" audio-devices.txt; then
            echo "No default output device; installing BlackHole (virtual audio device)"
            brew install --cask blackhole-2ch
            sudo killall coreaudiod || true
            sleep 5
            system_profiler SPAudioDataType
          fi

      - name: Shared tests (iOS simulator)
        run: tools/check/check.sh step ios-kotlin-tests

      # Lists every test that ran on the simulator, incl. the SQLite-backed shared/db / Ingestor tests (#14).
      - name: Shared test evidence (iOS simulator)
        if: success() || failure()
        run: tools/check/check.sh step ios-kotlin-evidence

      # The Xcode steps also run when a Kotlin test failed: one macOS run should report everything.
      - name: Install XcodeGen
        if: success() || failure()
        run: brew install xcodegen

      - name: Generate Xcode project
        id: xcodegen
        if: success() || failure()
        run: tools/check/check.sh step ios-xcodegen

      # A fixed -derivedDataPath (build/DerivedData) lets the launch smoke and hosted test steps below reuse these build products.
      - name: Build iOS app (embeds the watchOS app)
        id: build-ios
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: tools/check/check.sh step ios-build-app

      - name: Build watchOS app
        id: build-watch
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: tools/check/check.sh step ios-build-watch

      # #57: the audio-file input is Debug-only (#if DEBUG). Build Release and make sure it is not in the binary;
      # the Debug build above is the positive control for the search.
      - name: watchOS Release build has no debug audio input
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: tools/check/check.sh step ios-watch-release-check

      # #92: one simulator at a time, each booted once. The Apple Watch steps run first and share
      # one boot; the watch is then shut down, and the iPhone, booted by the Swift unit tests step,
      # stays up for the launch smoke and the hosted tests. (Two booted simulators on the 3-core
      # runner made every step 2-3x slower.)
      # #41: the complication's widget extension is embedded, and its tap URL launches the watch
      # app and starts the recorder (screenshots and the recorder log go to simulator-smoke).
      - name: watchOS complication tap on an Apple Watch simulator
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: tools/check/check.sh step ios-complication

      # #7: the apps must start, not only build. Install the products above on a booted
      # simulator, launch, wait 15 s, fail if the process died or a crash report appeared.
      - name: Launch watchOS app on an Apple Watch simulator
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: tools/check/check.sh step ios-watch-launch

      # Hostless Swift logic tests (no Kotlin build): the wire protocol vs. shared/protocol/testdata
      # (ProtocolTests), the watch recorder's stop reasons / state (#15) and send queue (#17)
      # (WatchLogicTests). Every test case is listed in the job summary.
      # Runs first on the iPhone (#92): xcode-test.sh boots it while these tests build, so the
      # first boot's data migration overlaps the build and the launch smoke finds a settled device.
      - name: Swift unit tests (iOS Simulator)
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: tools/check/check.sh step ios-swift-unit

      # #196: hour summaries with Apple's on-device Foundation Models (no Kotlin framework). The
      # availability codes, the schema from Kotlin's JSON and the error codes always run; the
      # generation needs Apple Intelligence, which these virtual runners do not have, so it records
      # the reason (LLM_AVAILABILITY) and skips. The device checks are #60.
      - name: On-device language model on the iOS simulator
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        timeout-minutes: 15
        run: tools/check/check.sh step ios-llm

      - name: Launch iOS app on an iPhone simulator
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        run: tools/check/check.sh step ios-launch

      # Hosted tests (Speech, Playback): the host app is uninstalled first so the test host gets a
      # fresh container (no erase, which would redo the 1-2 min boot migration; see xcode-test.sh).
      # OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES skips the Gradle run in the app's "Compile Kotlin
      # Framework" phase: the framework was built from the same sources by "Build iOS app" above,
      # which these steps require.
      # #21: SpeechAnalyzer / SpeechTranscriber (ja_JP) on the simulator with known Japanese speech
      # in the watch's format. If the simulator cannot transcribe, the tests skip with the reason
      # (shown in the summary); the device check is then #60.
      - name: Japanese test speech
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        continue-on-error: true # without audio the tests skip and say why
        run: tools/check/check.sh step ios-ja-speech

      # #170: Japanese -> English -> Japanese (and Japanese only) for EnglishTranscriptionTests, which
      # run the Swift transcriber through the shared routing and pipeline (IosTranscriptionCheck).
      # GitHub's simulators have no SpeechTranscriber, so they use DictationTranscriber there.
      - name: Japanese/English test speech
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        continue-on-error: true # without audio the tests skip and say why
        run: tools/check/check.sh step ios-mixed-speech

      - name: Speech transcription on the iOS simulator
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        timeout-minutes: 20
        run: tools/check/check.sh step ios-speech-tests

      # #19: real playback in the app process. The app's own IosAppServices (reached through the
      # ComposeApp framework) plays a 16 kHz AAC chunk from 8 s; the position must start there and
      # advance (the Kotlin IosPlaybackTest above cannot start AVAudioPlayer in its test executable).
      - name: Playback in the iOS app (simulator)
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        timeout-minutes: 15
        run: tools/check/check.sh step ios-playback

      # #178: the embedding model of semantic search for EmbeddingTests, the same pinned files and
      # SHA-256 as the app downloads; cached by the script's hash (it holds the pinned commits), so
      # only a change of the model downloads it again.
      - name: Cache the embedding model
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/embedding-model
          key: embedding-model-${{ hashFiles('.github/scripts/ios-embedding-model.sh') }}

      - name: Embedding model
        id: embedding-model
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        run: tools/check/check.sh step ios-embedding-model

      # #178: semantic search in the app process: ONNX Runtime (Swift package) against the JVM's
      # reference vectors and the Python reference, a paraphrase found by the embedding step and the
      # hybrid search, and the app's Wi-Fi-only download continuing an interrupted file.
      - name: Semantic search on the iOS simulator
        if: (success() || failure()) && steps.embedding-model.outcome == 'success'
        timeout-minutes: 15
        run: tools/check/check.sh step ios-semantic-search

      # #185: agent access in the app process against the real bridge CLI on this host (127.0.0.1):
      # pairing with the 6-digit code, tool calls answered only while on and on screen, then off,
      # background, revoke (.github/scripts/ios-agent-access.sh, AgentAccessTests).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/agent-bridge/package-lock.json

      - name: Build the agent bridge CLI
        id: build-bridge
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        run: tools/check/check.sh step bridge-build

      - name: Agent access on the iOS simulator (bridge CLI on the host)
        if: (success() || failure()) && steps.build-bridge.outcome == 'success'
        timeout-minutes: 20
        run: tools/check/check.sh step ios-agent-access

      # Booted simulators otherwise slow down the runner's orphan-process cleanup at the end.
      - name: Shut down simulators
        if: always()
        continue-on-error: true
        run: tools/check/check.sh step ios-shutdown

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-*.log
            build/xcresults/
            agent-access-logs/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kotlin-ios-test-results
          path: |
            shared/*/build/test-results/iosSimulatorArm64Test/
            shared/ui/build/test-results/iosSimulatorArm64Test/
            shared/ui/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swift-evidence
          path: |
            build/swift-evidence/
            build/ja-speech/
            build/mixed-speech/
            audio-devices.txt
            agent-access-logs/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-smoke
          path: simulator-smoke/
          if-no-files-found: ignore
          retention-days: 7

      # #41: complication layouts rendered by ComplicationDisplayTests (recording / paused / stopped).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: watch-complication-previews
          path: build/complication-previews/
          if-no-files-found: ignore
          retention-days: 7

  # #78: the Release configuration (what a TestFlight build ships, #35) built for devices without
  # signing: the iOS app with the embedded watchOS app, and the watchOS app on its own. A separate
  # job so it runs in parallel with the simulator checks in `build`.
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: tools/check/check.sh step ios-xcodegen

      # The Xcode build phase links the Kotlin framework in its release flavour (iosArm64).
      - name: Build iOS app, Release, device (embeds the watchOS app)
        run: tools/check/check.sh step ios-release-build-app

      - name: Build watchOS app, Release, device
        if: success() || failure()
        run: tools/check/check.sh step ios-release-build-watch

      # Evidence for the job summary: one RELEASE_BUILD_CHECK line per app (architectures, size), and
      # the Debug-only audio-file input (#57) must not be in the Release binaries.
      - name: Release build evidence
        run: tools/check/check.sh step ios-release-evidence

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-release-logs
          path: xcodebuild-*.log
          retention-days: 7
