name: iOS & watchOS

# macOS minutes are billed at 10x on private repos, so this only runs when
# Apple-side or shared code changes (or on demand).
on:
  push:
    branches: [main]
    paths:
      - "iosApp/**"
      - "shared/**"
      - "composeApp/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "iosApp/**"
      - "shared/**"
      - "composeApp/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show Xcode version
        run: xcodebuild -version

      # The playback checks in composeApp's iOS tests (#19, #25) need AVAudioPlayer's clock to run,
      # i.e. an audio output device on the host; add a virtual one if the runner has none.
      - name: Audio output for the simulators
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType | tee audio-devices.txt
          if ! grep -q "Default Output Device: Yes" audio-devices.txt; then
            echo "No default output device; installing BlackHole (virtual audio device)"
            brew install --cask blackhole-2ch
            sudo killall coreaudiod || true
            sleep 5
            system_profiler SPAudioDataType
          fi

      - name: Shared tests (iOS simulator)
        run: ./gradlew iosSimulatorArm64Test

      # Lists every test that ran on the simulator, incl. the SQLite-backed core-db / Ingestor tests (#14).
      - name: Shared test evidence (iOS simulator)
        if: success() || failure()
        run: |
          python3 .github/scripts/junit-summary.py "Shared Kotlin tests on the iOS simulator" \
            'shared/*/build/test-results/iosSimulatorArm64Test/*.xml' \
            'composeApp/build/test-results/iosSimulatorArm64Test/*.xml' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Playback checks on the iOS simulator (IosPlaybackTest, #19 / #25):"
            echo '```'
            grep -ho "PLAYBACK_CHECK[^<&]*" composeApp/build/test-results/iosSimulatorArm64Test/*.xml || echo "no PLAYBACK_CHECK lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Xcode steps also run when a Kotlin test failed: one macOS run should report everything.
      - name: Generate Xcode project
        id: xcodegen
        if: success() || failure()
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # A fixed -derivedDataPath lets the launch smoke and hosted test steps below reuse these build products.
      - name: Build iOS app (embeds the watchOS app)
        id: build-ios
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: |
          xcodebuild -project iosApp/WatchAudio.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet 2>&1 | tee xcodebuild-ios.log; exit ${PIPESTATUS[0]}

      - name: Build watchOS app
        id: build-watch
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: |
          xcodebuild -project iosApp/WatchAudio.xcodeproj -scheme WatchApp \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet 2>&1 | tee xcodebuild-watch.log; exit ${PIPESTATUS[0]}

      # #7: the apps must start, not only build. Install the products above on a booted
      # simulator, launch, wait 15 s, fail if the process died or a crash report appeared.
      - name: Launch iOS app on an iPhone simulator
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        run: |
          .github/scripts/simulator-smoke.sh iOS iPhone \
            build/DerivedData/Build/Products/Debug-iphonesimulator/WatchAudio.app app.watchaudio

      - name: Launch watchOS app on an Apple Watch simulator
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: |
          .github/scripts/simulator-smoke.sh watchOS "Apple Watch" \
            build/DerivedData/Build/Products/Debug-watchsimulator/WatchAudio.app app.watchaudio.watchkitapp

      # Hostless Swift logic tests (no Kotlin build): the wire protocol vs. shared/core-protocol/testdata
      # (ProtocolTests), the watch recorder's stop reasons / state (#15) and send queue (#17)
      # (WatchLogicTests). Every test case is listed in the job summary.
      - name: Swift unit tests (iOS Simulator)
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: .github/scripts/xcode-test.sh SwiftUnitTests "Swift unit tests on the iOS simulator"

      # #21: SpeechAnalyzer / SpeechTranscriber (ja_JP) on the simulator with known Japanese speech
      # in the watch's format. If the simulator cannot transcribe, the tests skip with the reason
      # (shown in the summary); the device check is then #60.
      - name: Japanese test speech
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        continue-on-error: true # without audio the tests skip and say why
        run: .github/scripts/make-ja-speech.sh build/ja-speech

      - name: Speech transcription on the iOS simulator
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        timeout-minutes: 15
        run: |
          status=0
          ERASE_SIMULATOR=1 .github/scripts/xcode-test.sh SpeechTests "SpeechTranscriber (ja_JP) on the iOS simulator" || status=$?
          {
            echo "Speech check logs (build/swift-evidence):"
            echo '```'
            cat build/swift-evidence/*.txt 2>/dev/null || echo "no evidence written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-*.log
            build/xcresults/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-ios-test-results
          path: |
            shared/*/build/test-results/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
            composeApp/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-evidence
          path: |
            build/swift-evidence/
            build/ja-speech/
            audio-devices.txt
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: simulator-smoke/
          if-no-files-found: ignore
          retention-days: 7
