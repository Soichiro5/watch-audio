name: iOS & watchOS

# macOS minutes are billed at 10x on private repos, so this only runs when
# Apple-side or shared code changes (or on demand).
on:
  push:
    branches: [main]
    paths:
      - "iosApp/**"
      - "shared/**"
      - "composeApp/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
      - "!**/*.md"
      - "!docs/**"
      - "!**/src/androidMain/**"
      - "!**/src/androidHostTest/**"
      - "!**/src/androidDeviceTest/**"
      - "!**/src/jvmMain/**"
      - "!**/src/jvmTest/**"
      - "!.github/scripts/phone-scenarios.sh"
      - "!.github/scripts/wear-surfaces.sh"
      - "!.github/scripts/launch-smoke.sh"
  pull_request:
    branches: [main]
    paths:
      - "iosApp/**"
      - "shared/**"
      - "composeApp/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
      - "!**/*.md"
      - "!docs/**"
      - "!**/src/androidMain/**"
      - "!**/src/androidHostTest/**"
      - "!**/src/androidDeviceTest/**"
      - "!**/src/jvmMain/**"
      - "!**/src/jvmTest/**"
      - "!.github/scripts/phone-scenarios.sh"
      - "!.github/scripts/wear-surfaces.sh"
      - "!.github/scripts/launch-smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #92: three independent macOS jobs run in parallel (they share no build products), and a small
  # Linux job merges the artifacts two of them produce. A failure in one job does not stop the
  # others, so one run still reports everything.

  # Kotlin shared tests on the iOS simulator and the hostless Swift unit tests (no app build).
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Shared tests (iOS simulator)
        run: ./gradlew iosSimulatorArm64Test

      # Lists every test that ran on the simulator, incl. the SQLite-backed core-db / Ingestor tests (#14).
      - name: Shared test evidence (iOS simulator)
        if: success() || failure()
        run: |
          python3 .github/scripts/junit-summary.py "Shared Kotlin tests on the iOS simulator" \
            'shared/*/build/test-results/iosSimulatorArm64Test/*.xml' \
            'composeApp/build/test-results/iosSimulatorArm64Test/*.xml' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Playback checks on the iOS simulator (IosPlaybackTest, #19 / #25; the player is prepared, started= is informational):"
            echo '```'
            grep -ho "PLAYBACK_CHECK[^<&]*" composeApp/build/test-results/iosSimulatorArm64Test/*.xml || echo "no PLAYBACK_CHECK lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Swift tests also run when a Kotlin test failed: one macOS run should report everything.
      - name: Generate Xcode project
        id: xcodegen
        if: success() || failure()
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # Hostless Swift logic tests (no Kotlin build): the wire protocol vs. shared/core-protocol/testdata
      # (ProtocolTests), the watch recorder's stop reasons / state (#15) and send queue (#17)
      # (WatchLogicTests). Every test case is listed in the job summary. ComplicationDisplayTests
      # (#41) also write build/complication-previews here.
      - name: Swift unit tests (iOS Simulator)
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: .github/scripts/xcode-test.sh SwiftUnitTests "Swift unit tests on the iOS simulator"

      # Merged into xcodebuild-logs by the artifacts job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-logs-unit-tests
          path: |
            xcodebuild-*.log
            build/xcresults/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kotlin-ios-test-results
          path: |
            shared/*/build/test-results/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
            composeApp/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 7

      # #41: complication layouts rendered by ComplicationDisplayTests (recording / paused / stopped).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: watch-complication-previews
          path: build/complication-previews/
          if-no-files-found: ignore
          retention-days: 7

  # The iOS app (its build phase links the Kotlin framework and embeds the watchOS app): launch
  # smoke and the app-hosted XCTests.
  ios-app:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show Xcode version
        run: xcodebuild -version

      # The app-hosted playback check (PlaybackTests, #19) needs AVAudioPlayer's clock to run,
      # i.e. an audio output device on the host; add a virtual one if the runner has none.
      - name: Audio output for the simulators
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType | tee audio-devices.txt
          if ! grep -q "Default Output Device: Yes" audio-devices.txt; then
            echo "No default output device; installing BlackHole (virtual audio device)"
            brew install --cask blackhole-2ch
            sudo killall coreaudiod || true
            sleep 5
            system_profiler SPAudioDataType
          fi

      - name: Generate Xcode project
        id: xcodegen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # A fixed -derivedDataPath lets the launch smoke and hosted test steps below reuse these build products.
      - name: Build iOS app (embeds the watchOS app)
        id: build-ios
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: |
          xcodebuild -project iosApp/WatchAudio.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet 2>&1 | tee xcodebuild-ios.log; exit ${PIPESTATUS[0]}

      # #7: the app must start, not only build. Install the product above on a booted
      # simulator, launch, wait 15 s, fail if the process died or a crash report appeared.
      - name: Launch iOS app on an iPhone simulator
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        run: |
          .github/scripts/simulator-smoke.sh iOS iPhone \
            build/DerivedData/Build/Products/Debug-iphonesimulator/WatchAudio.app app.watchaudio

      # #21: SpeechAnalyzer / SpeechTranscriber (ja_JP) on the simulator with known Japanese speech
      # in the watch's format. If the simulator cannot transcribe, the tests skip with the reason
      # (shown in the summary); the device check is then #60.
      - name: Japanese test speech
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        continue-on-error: true # without audio the tests skip and say why
        run: .github/scripts/make-ja-speech.sh build/ja-speech

      - name: Speech transcription on the iOS simulator
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        timeout-minutes: 15
        run: |
          status=0
          ERASE_SIMULATOR=1 .github/scripts/xcode-test.sh SpeechTests "SpeechTranscriber (ja_JP) on the iOS simulator" || status=$?
          {
            echo "Speech check logs (build/swift-evidence):"
            echo '```'
            cat build/swift-evidence/speech-*.txt 2>/dev/null || echo "no evidence written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # #19: real playback in the app process. The app's own IosAppServices (reached through the
      # ComposeApp framework) plays a 16 kHz AAC chunk from 8 s; the position must start there and
      # advance (the Kotlin IosPlaybackTest in unit-tests cannot start AVAudioPlayer in its test executable).
      - name: Playback in the iOS app (simulator)
        if: (success() || failure()) && steps.build-ios.outcome == 'success'
        timeout-minutes: 15
        run: |
          status=0
          ERASE_SIMULATOR=1 .github/scripts/xcode-test.sh PlaybackTests "Playback in the iOS app on the simulator (#19)" || status=$?
          {
            echo "Playback check in the app process (PlaybackTests):"
            echo '```'
            cat build/swift-evidence/hosted-playback.txt 2>/dev/null || echo "no evidence written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Merged into xcodebuild-logs by the artifacts job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-logs-ios-app
          path: |
            xcodebuild-*.log
            build/xcresults/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swift-evidence
          path: |
            build/swift-evidence/
            build/ja-speech/
            audio-devices.txt
          if-no-files-found: ignore
          retention-days: 7

      # Merged into simulator-smoke by the artifacts job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-smoke-ios-app
          path: simulator-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # The watchOS app on its own (no Kotlin): Debug build, the Release check for the debug audio
  # input, the complication tap and the launch smoke on an Apple Watch simulator.
  watch-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        id: xcodegen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build watchOS app
        id: build-watch
        if: (success() || failure()) && steps.xcodegen.outcome == 'success'
        run: |
          xcodebuild -project iosApp/WatchAudio.xcodeproj -scheme WatchApp \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet 2>&1 | tee xcodebuild-watch.log; exit ${PIPESTATUS[0]}

      # #57: the audio-file input is Debug-only (#if DEBUG). Build Release and make sure it is not in the binary;
      # the Debug build above is the positive control for the search.
      - name: watchOS Release build has no debug audio input
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: |
          xcodebuild -project iosApp/WatchAudio.xcodeproj -scheme WatchApp \
            -configuration Release -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet 2>&1 | tee xcodebuild-watch-release.log; test ${PIPESTATUS[0]} -eq 0
          DEBUG_APP=$(find build/DerivedData/Build/Products/Debug-watchsimulator -maxdepth 1 -name '*.app' | head -1)
          RELEASE_APP=$(find build/DerivedData/Build/Products/Release-watchsimulator -maxdepth 1 -name '*.app' | head -1)
          echo "Debug: $DEBUG_APP / Release: $RELEASE_APP"
          grep -rqa DebugAudioFileInput "$DEBUG_APP" || { echo "DebugAudioFileInput not found in the Debug app (search is broken)"; exit 1; }
          if grep -rla DebugAudioFileInput "$RELEASE_APP"; then echo "DebugAudioFileInput leaked into the Release app"; exit 1; fi
          echo "OK: DebugAudioFileInput is in the Debug app and absent from the Release app" | tee -a "$GITHUB_STEP_SUMMARY"

      # #41: the complication's widget extension is embedded, and its tap URL launches the watch
      # app and starts the recorder (screenshots and the recorder log go to simulator-smoke).
      - name: watchOS complication tap on an Apple Watch simulator
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: |
          .github/scripts/watch-complication-smoke.sh \
            build/DerivedData/Build/Products/Debug-watchsimulator/WatchAudio.app app.watchaudio.watchkitapp

      # #7: the app must start, not only build (same check as the iOS launch smoke).
      - name: Launch watchOS app on an Apple Watch simulator
        if: (success() || failure()) && steps.build-watch.outcome == 'success'
        run: |
          .github/scripts/simulator-smoke.sh watchOS "Apple Watch" \
            build/DerivedData/Build/Products/Debug-watchsimulator/WatchAudio.app app.watchaudio.watchkitapp

      # Merged into xcodebuild-logs by the artifacts job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-logs-watch-app
          path: xcodebuild-*.log
          retention-days: 7

      # Merged into simulator-smoke by the artifacts job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator-smoke-watch-app
          path: simulator-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # One artifact per name, as before the split: simulator-smoke (iOS + watchOS screenshots and logs)
  # and, when a job failed, xcodebuild-logs. The per-job parts are deleted after the merge.
  artifacts:
    needs: [unit-tests, ios-app, watch-app]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Merge simulator-smoke
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true # no part when both app builds failed
        with:
          name: simulator-smoke
          pattern: simulator-smoke-*
          delete-merged: true
          retention-days: 7

      - name: Merge xcodebuild-logs
        if: contains(needs.*.result, 'failure')
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true # a job can fail before it writes any log
        with:
          name: xcodebuild-logs
          pattern: xcodebuild-logs-*
          delete-merged: true
          retention-days: 7
