name: Emulator smoke test

# Device-free check (#44): boot a phone and a Wear OS emulator, install the debug
# builds, launch them and fail on crashes of our own process (system apps such as the
# Wear setup wizard sometimes crash on CI images and must not fail the check). Runs on Linux runners (KVM), 1x minutes.
# On the phone emulator it also runs the instrumented tests: real MediaPlayer playback and
# the search -> one tap -> play flow (#19, #25), and the shared SQLite tests of core-db and
# core-pipeline on Android (#14).
on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "wearApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/emulator.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "androidApp/**"
      - "wearApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/emulator.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            module: androidApp
            api-level: 35
            target: google_apis
            # Audio stays enabled: the playback tests need a working audio output.
            emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
            device-test-apks: :androidApp:assembleDebugAndroidTest :shared:core-db:assembleAndroidDeviceTest :shared:core-pipeline:assembleAndroidDeviceTest
            device-tests: :androidApp:connectedDebugAndroidTest :shared:core-db:connectedAndroidDeviceTest :shared:core-pipeline:connectedAndroidDeviceTest
            # Each of these must report at least one test case: the test engine can end green with 0 tests (e.g. a failed APK install).
            device-test-modules: androidApp shared/core-db shared/core-pipeline
          - name: wear
            module: wearApp
            api-level: 34
            target: android-wear
            emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    name: smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-java: the tool cache it clears is where the JDK is installed.
      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK (and instrumented test APKs)
        run: ./gradlew :${{ matrix.module }}:assembleDebug ${{ matrix.device-test-apks }}

      - name: Install, launch and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          emulator-options: ${{ matrix.emulator-options }}
          script: |
            adb install -r ${{ matrix.module }}/build/outputs/apk/debug/*.apk
            adb logcat -c
            adb shell monkey -p app.watchaudio -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > logcat.txt || (sleep 5 && adb wait-for-device && adb logcat -d > logcat.txt)
            adb shell pidof app.watchaudio || (echo "app is not running"; exit 1)
            if grep -q "AndroidRuntime: Process: app.watchaudio" logcat.txt; then grep -B2 -A25 "AndroidRuntime: Process: app.watchaudio" logcat.txt; exit 1; fi
            # The test engine reinstalls the app itself; remove the smoke-test install so a signature mismatch cannot skip the tests.
            if [ -n "${{ matrix.device-tests }}" ]; then adb uninstall app.watchaudio || true; fi
            if [ -n "${{ matrix.device-tests }}" ]; then adb logcat -c; ./gradlew ${{ matrix.device-tests }} || touch device-tests-failed; adb logcat -d > logcat-device-tests.txt || true; fi
            if [ -f device-tests-failed ]; then echo "instrumented tests failed"; exit 1; fi
            for m in ${{ matrix.device-test-modules }}; do n=$(find "$m/build/outputs/androidTest-results/connected" -name '*.xml' -exec grep -o '<testcase ' {} + 2>/dev/null | wc -l); echo "$m: $n instrumented test cases"; if [ "$n" -eq 0 ]; then echo "no instrumented tests ran for $m"; exit 1; fi; done

      - name: Instrumented test evidence
        if: always() && matrix.device-tests != ''
        run: |
          python3 .github/scripts/junit-summary.py "Instrumented tests on the ${{ matrix.name }} emulator (API ${{ matrix.api-level }})" \
            'androidApp/build/outputs/androidTest-results/connected/**/*.xml' \
            'shared/*/build/outputs/androidTest-results/connected/**/*.xml' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Playback checks (logcat):"
            echo '```'
            grep -ho "PLAYBACK_CHECK.*" logcat-device-tests.txt || echo "no PLAYBACK_CHECK lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat-${{ matrix.name }}
          path: |
            logcat.txt
            logcat-device-tests.txt
            androidApp/build/reports/androidTests/
            shared/*/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
