name: Emulator smoke test

# Device-free check (#44): boot a phone and a Wear OS emulator, install the debug
# builds, launch them and fail on crashes. Runs on Linux runners (KVM), 1x minutes.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "androidApp/**"
      - "wearApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/emulator.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            module: androidApp
            api-level: 35
            target: google_apis
          - name: wear
            module: wearApp
            api-level: 34
            target: android-wear
    name: smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew :${{ matrix.module }}:assembleDebug

      - name: Install, launch and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r ${{ matrix.module }}/build/outputs/apk/debug/*.apk
            adb logcat -c
            adb shell monkey -p app.watchaudio -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > logcat.txt
            adb shell pidof app.watchaudio || (echo "app is not running"; exit 1)
            if grep -E "FATAL EXCEPTION|AndroidRuntime: Process: app.watchaudio" logcat.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat-${{ matrix.name }}
          path: logcat.txt
          retention-days: 7
